[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackathon-everest"
version = "0.1.0"
description = "Continuous foothold assurance for a sensorized Unitree G1 crampon"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "Hackathon Everest"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[project.optional-dependencies]
gpu = ["torch>=2.7"]
mujoco = ["mujoco>=3.2"]
calibration = ["snowmicropyn>=1.4"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
everest = "hackathon_everest.cli:main"

[project.urls]
Homepage = "https://github.com/joshuajerin/hackathon-everest"
Documentation = "https://github.com/joshuajerin/hackathon-everest/tree/main/docs"
Issues = "https://github.com/joshuajerin/hackathon-everest/issues"
Source = "https://github.com/joshuajerin/hackathon-everest"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_everest"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
